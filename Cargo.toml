[package]
name = "gather-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Bounded local asset collection and accepted-packet export core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
